[project]
name = "market-dashboard"
version = "0.1.0"
description = "Panel de precios en vivo (estilo TradingView) construido con Flask, arquitectura MVC y datos de Yahoo Finance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "yfinance>=1.7.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
